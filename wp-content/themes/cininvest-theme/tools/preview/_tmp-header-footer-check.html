<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>header/footer check</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">

</head><body>
<header class="site-header">
    <div class="container site-header__inner">
        <a class="site-header__logo" href="#"><img src="../../assets/img/logo.svg" alt="CININVEST"></a>

            <a class="site-header__auth" href="#">Вход</a>
            <a class="btn btn--primary site-header__cta" href="#">Регистрация</a>

        </div>
